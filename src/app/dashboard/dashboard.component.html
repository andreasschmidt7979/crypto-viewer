<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f0f0;
    overflow: hidden;
  }

  .text-container {
    position: relative;
    width: 90vw;
    height: 90vh;
  }

  .appearing-text {
    position: absolute;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 2em;
    opacity: 0; /* Anfangs unsichtbar */
    animation: appear 5s forwards, disappear 5s forwards 6s infinite; /* Erscheinen nach 0s, Verschwinden nach 3s */
  }

  @keyframes appear {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }

  @keyframes disappear {
    0% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }
</style>
<body>
  <div class="text-container">
    <span class="appearing-text" style="top: 10%; left: 15%; color: red"
      >Andreas</span
    >
    <span
      class="appearing-text"
      style="top: 40%; left: 60%; color: blue; animation-delay: 0.5s"
      >Schmidt</span
    >
    <span
      class="appearing-text"
      style="top: 70%; left: 25%; color: green; animation-delay: 1s"
      >Seite</span
    >
    <span
      class="appearing-text"
      style="top: 20%; left: 80%; color: orange; animation-delay: 1.5s"
      >mit</span
    >
    <span
      class="appearing-text"
      style="top: 55%; left: 10%; color: purple; animation-delay: 2s"
      >Type- und JavaScript</span
    >
    <span
      class="appearing-text"
      style="top: 85%; left: 70%; color: brown; animation-delay: 2.5s"
      >Angular, React, ...</span
    >
  </div>
</body>
